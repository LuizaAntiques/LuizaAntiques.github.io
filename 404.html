<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A Maldição do Silêncio</title>
    <script>
      // Solução para SPAs no GitHub Pages
      // Redireciona todas as rotas 404 para index.html para que o React Router funcione
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      
      // Redireciona para index.html mantendo a rota original
      if (path !== '/404.html' && path !== '/index.html') {
        window.location.replace('/index.html' + path + search + hash);
      } else if (path === '/404.html') {
        // Se acessou diretamente o 404.html, redireciona para home
        window.location.replace('/');
      }
    </script>
  </head>
  <body>
    <noscript>
      Você precisa habilitar JavaScript para executar este aplicativo.
      <a href="/">Clique aqui para ir para a página inicial</a>
    </noscript>
  </body>
</html>
