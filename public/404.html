<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="A Maldição do Silêncio - Jogo de Enigmas Escape Room"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>A Maldição do Silêncio</title>
  </head>
  <body>
    <noscript>Você precisa habilitar JavaScript para executar este aplicativo.</noscript>
    <div id="root"></div>
    <script>
      // Ajusta o pathname para o React Router processar corretamente
      // Remove /404.html do pathname se estiver presente
      (function() {
        var path = window.location.pathname;
        if (path.includes('/404.html')) {
          var newPath = path.replace('/404.html', '') || '/';
          window.history.replaceState(null, null, newPath + window.location.search + window.location.hash);
        }
      })();
    </script>
  </body>
</html>
